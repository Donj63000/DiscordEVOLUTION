name: Evolution Build - integration
on:
  pull_request:
    paths:
      - 'build.py'
      - 'utils/build/**'
      - 'utils/evo_tools.py'
      - 'utils/slash_errors.py'
      - 'utils/slash_support.py'
      - 'tests_build/**'
      - 'data/build/**'
      - 'requirements.txt'
      - 'tools/build_preflight.py'
      - 'docs/EVOLUTION_BUILD*'
      - '.github/workflows/evolution-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_ENABLED: 'false'
      BUILD_AI_ENABLED: 'false'
      BUILD_OPTIMIZER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install actual project dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline catalogue and dependency preflight
        run: python tools/build_preflight.py
      - name: Compile modules
        run: python -m compileall -q build.py utils/build utils/slash_errors.py utils/slash_support.py tests_build
      - name: Domain, simulated console storage and discord.py integration tests
        run: python -m pytest tests_build -q --junitxml=build-tests.xml
      - name: Existing bot non-regression suites
        run: python -m pytest tests tests_evo tests_jobs -q --junitxml=bot-regression-tests.xml
      - name: Preserve test result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolution-build-tests
          path: |
            build-tests.xml
            bot-regression-tests.xml
