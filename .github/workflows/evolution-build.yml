name: Evolution Build - integration
on:
  pull_request:
    paths:
      - 'build.py'
      - 'utils/build/**'
      - 'utils/evo_tools.py'
      - 'tests_build/**'
      - 'migrations/build/**'
      - 'data/build/**'
      - 'requirements.txt'
      - 'tools/build_preflight.py'
      - 'docs/EVOLUTION_BUILD*'
      - '.github/workflows/evolution-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build_test
          POSTGRES_PASSWORD: test_only_ephemeral
          POSTGRES_DB: build_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build_test -d build_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUILD_TEST_DATABASE_URL: postgresql://build_test:test_only_ephemeral@localhost:5432/build_test
      BUILD_ENABLED: 'false'
      BUILD_AI_ENABLED: 'false'
      BUILD_OPTIMIZER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install actual project dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline catalogue and dependency preflight
        run: python tools/build_preflight.py
      - name: Compile modules
        run: python -m compileall -q build.py utils/build tests_build
      - name: Unit and real PostgreSQL/discord.py integration tests
        run: python -m pytest tests_build -q --junitxml=build-tests.xml
      - name: Existing bot non-regression suites
        run: python -m pytest tests tests_evo tests_jobs -q --junitxml=bot-regression-tests.xml
      - name: Preserve test result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolution-build-tests
          path: |
            build-tests.xml
            bot-regression-tests.xml
