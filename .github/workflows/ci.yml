name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discord_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d discord_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/discord_security_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/linux-py*.lock

      - name: Install hash-verified dependencies in a clean environment
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/app-env"
          echo "$RUNNER_TEMP/app-env/bin" >> "$GITHUB_PATH"
          lock_version="${{ matrix.python-version }}"
          lock_version="${lock_version/./}"
          python -m pip --python "$RUNNER_TEMP/app-env/bin/python" install --require-hashes -r "requirements/linux-py${lock_version}.lock"
          python -m pip --python "$RUNNER_TEMP/app-env/bin/python" check
          mkdir -p artifacts
          python -m pip --python "$RUNNER_TEMP/app-env/bin/python" freeze > artifacts/installed-${{ matrix.python-version }}.txt

      - name: Run security regressions with the actual SDKs in isolation
        run: python -m pytest tests_security -q -W error::pytest.PytestDeprecationWarning --junitxml=artifacts/security-${{ matrix.python-version }}.xml

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            main.py \
            *.py \
            cogs \
            models \
            tests \
            tests_security \
            tests_support \
            utils

      - name: Run strict pytest suite
        run: |
          mkdir -p artifacts
          python -m pytest \
            -W error::pytest.PytestDeprecationWarning \
            --junitxml=artifacts/pytest-${{ matrix.python-version }}.xml \
            --cov=. \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:artifacts/coverage-${{ matrix.python-version }}.xml

      - name: Audit every locked dependency with PyPI and OSV
        if: always()
        run: |
          mkdir -p artifacts
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/python" -m pip install pip-audit==2.10.1
          lock_version="${{ matrix.python-version }}"
          lock_version="${lock_version/./}"
          set +e
          "$RUNNER_TEMP/audit-env/bin/pip-audit" -r "requirements/linux-py${lock_version}.lock" --require-hashes --disable-pip --strict --vulnerability-service pypi --format json --output artifacts/audit-pypi-${{ matrix.python-version }}.json
          audit_pypi_status=$?
          "$RUNNER_TEMP/audit-env/bin/pip-audit" -r "requirements/linux-py${lock_version}.lock" --require-hashes --disable-pip --strict --vulnerability-service osv --format json --output artifacts/audit-osv-${{ matrix.python-version }}.json
          audit_osv_status=$?
          set -e
          test "$audit_pypi_status" -eq 0
          test "$audit_osv_status" -eq 0

      - name: Validate FM model invariants with Monte Carlo
        run: |
          python tools/fm_retro_validate.py monte-carlo \
            --draws 100000 --seed 129 \
            --output artifacts/fm-model-${{ matrix.python-version }}.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
