<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Comment fonctionne Evolution BOT</title>
  <desc id="map-description">Discord transmet les commandes slash et les commandes avec point d'exclamation au bot. Ses modules gèrent les métiers, profils, activités, annonces, la modération, l'IA Staff et l'encyclopédie. Les données de guilde sont sauvegardées et restaurées depuis les messages de #console. L'encyclopédie consulte une API publique et conserve un cache en mémoire, séparé des données de guilde.</desc>
  <defs>
    <linearGradient id="map-background" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F22"/>
      <stop offset="1" stop-color="#10213D"/>
    </linearGradient>
    <linearGradient id="map-core" x1="310" y1="134" x2="640" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16366B"/>
      <stop offset="1" stop-color="#112748"/>
    </linearGradient>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" stroke="#79ABFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="478" rx="24" fill="url(#map-background)" stroke="#315181" stroke-opacity="0.7"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="55" fill="#F4F8FF" font-size="32" font-weight="700">Comment fonctionne le bot</text>
    <text x="40" y="89" fill="#B5C9E9" font-size="20">Des commandes dans Discord, des modules dédiés et deux usages distincts des données.</text>

    <path d="M268 242H304" stroke="#79ABFF" stroke-width="2" marker-end="url(#map-arrow)"/>
    <path d="M646 242H676V198H704" stroke="#79ABFF" stroke-width="2" stroke-linejoin="round" marker-start="url(#map-arrow)" marker-end="url(#map-arrow)"/>
    <path d="M676 242V341H704" stroke="#79ABFF" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#map-arrow)"/>
    <circle cx="676" cy="242" r="4" fill="#79ABFF"/>

    <rect x="40" y="134" width="228" height="216" rx="18" fill="#0E1C35" stroke="#365A92"/>
    <text x="64" y="175" fill="#F4F8FF" font-size="27" font-weight="700">Discord</text>
    <rect x="64" y="200" width="76" height="54" rx="12" fill="#142F59"/>
    <rect x="154" y="200" width="76" height="54" rx="12" fill="#142F59"/>
    <text x="102" y="239" text-anchor="middle" fill="#75A7FF" font-size="38" font-weight="700">/</text>
    <text x="192" y="239" text-anchor="middle" fill="#56E7FF" font-size="38" font-weight="700">!</text>
    <text x="64" y="293" fill="#BDCFEC" font-size="20">Commandes, boutons</text>
    <text x="64" y="322" fill="#BDCFEC" font-size="20">et formulaires</text>

    <rect x="310" y="134" width="330" height="216" rx="18" fill="url(#map-core)" stroke="#588EFF"/>
    <rect x="334" y="156" width="4" height="25" rx="2" fill="#56E7FF"/>
    <text x="351" y="178" fill="#F4F8FF" font-size="27" font-weight="700">Evolution BOT</text>
    <text x="334" y="214" fill="#8FB6FF" font-size="20">main.py · modules · cogs</text>
    <path d="M334 232H616" stroke="#43689B"/>
    <text x="334" y="264" fill="#DAE6FB" font-size="20">Métiers · profils · activités</text>
    <text x="334" y="295" fill="#DAE6FB" font-size="20">Modération · annonces · IA</text>
    <text x="334" y="326" fill="#DAE6FB" font-size="20">Encyclopédie Dofus Rétro</text>

    <rect x="710" y="134" width="450" height="128" rx="18" fill="#0E1C35" stroke="#365A92"/>
    <text x="736" y="172" fill="#8FB6FF" font-size="17" font-weight="700" letter-spacing="1">DONNÉES DE GUILDE</text>
    <text x="736" y="206" fill="#F4F8FF" font-size="28" font-weight="700">#console</text>
    <text x="736" y="239" fill="#BDCFEC" font-size="20">Sauvegardes et reprise après redémarrage</text>

    <rect x="710" y="284" width="450" height="128" rx="18" fill="#0E2435" stroke="#28788A"/>
    <text x="736" y="322" fill="#65DDED" font-size="17" font-weight="700" letter-spacing="1">ENCYCLOPÉDIE DOFUS RÉTRO</text>
    <text x="736" y="356" fill="#F4F8FF" font-size="28" font-weight="700">API publique · lecture</text>
    <text x="736" y="389" fill="#BDCFEC" font-size="20">Cache en mémoire, séparé de #console</text>

    <text x="40" y="449" fill="#8DA8D1" font-size="18">Les modules appliquent les permissions et les validations des commandes.</text>
  </g>
</svg>
