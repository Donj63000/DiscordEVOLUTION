<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Evolution BOT — votre guilde et Dofus Rétro dans Discord</title>
  <desc id="hero-description">Métiers, événements, encyclopédie et IA Staff. Les commandes sont accessibles avec la barre oblique ou le préfixe point d'exclamation.</desc>
  <defs>
    <linearGradient id="hero-background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F22"/>
      <stop offset="1" stop-color="#10254A"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="56" y1="0" x2="1144" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#245CFF"/>
      <stop offset="1" stop-color="#56E7FF"/>
    </linearGradient>
    <linearGradient id="hero-symbol" x1="885" y1="90" x2="1090" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FA6FF"/>
      <stop offset="1" stop-color="#56E7FF"/>
    </linearGradient>
    <clipPath id="hero-clip">
      <rect x="1" y="1" width="1198" height="318" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="320" fill="url(#hero-background)"/>
    <circle cx="1150" cy="-30" r="240" stroke="#2E6CFF" stroke-opacity="0.17" stroke-width="64"/>
    <circle cx="1150" cy="-30" r="344" stroke="#56E7FF" stroke-opacity="0.07" stroke-width="1"/>
    <path d="M56 278H1144" stroke="url(#hero-accent)" stroke-opacity="0.35"/>
    <rect x="56" y="44" width="32" height="4" rx="2" fill="#56E7FF"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="102" y="53" fill="#B5CEFA" font-size="18" font-weight="600" letter-spacing="2">DISCORD · GUILDE EVOLUTION</text>
      <text x="54" y="142" fill="#F4F8FF" font-size="68" font-weight="700" letter-spacing="-2">Evolution BOT</text>
      <text x="56" y="192" fill="#C5D5F0" font-size="27">Votre guilde et Dofus Rétro, dans Discord.</text>
      <text x="56" y="243" fill="#8FB6FF" font-size="19" font-weight="600">MÉTIERS · ÉVÉNEMENTS · ENCYCLOPÉDIE · IA STAFF</text>
      <rect x="832" y="50" width="312" height="196" rx="20" fill="#0B1830" stroke="#497ACD" stroke-opacity="0.65"/>
      <text x="988" y="161" text-anchor="middle" fill="url(#hero-symbol)" font-size="92" font-weight="700">/ <tspan fill="#6983B0" font-size="32" font-weight="400">ou</tspan> !</text>
      <text x="988" y="208" text-anchor="middle" fill="#D5E4FF" font-size="21">À vous de choisir.</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="24" stroke="#315181" stroke-opacity="0.7"/>
</svg>
